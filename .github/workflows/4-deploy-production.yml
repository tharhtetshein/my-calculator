name: 4️⃣ Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., v1.0.0)"
        required: true
        type: string
      confirm_production:
        description: "Type 'DEPLOY' to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Validate Confirmation
        run: |
          if [ "${{ inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "❌ Production deployment not confirmed"
            echo "You must type 'DEPLOY' to confirm production deployment"
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: 🏷️ Validate Version Format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must be in format vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: 🏷️ Display Version
        run: |
          echo "🚀 Deploying version: ${{ inputs.version }}"
          echo "📅 Deployment time: $(date -u)"

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: ✅ Run Tests
        run: pytest tests/ -v

      - name: 🚀 Deploy to Production
        run: |
          echo "🚀 Deploying version ${{ inputs.version }} to PRODUCTION"
          echo "⚠️  This is a production deployment!"
          echo "✅ Application deployed successfully"

      - name: 🏥 Health Check
        run: |
          python -c "from src.app import Calculator; c = Calculator(); assert c.add(2, 3) == 5; print('✅ Production health check passed')"

      - name: ✨ Deployment Complete
        run: |
          echo "🎉 Successfully deployed ${{ inputs.version }} to Production!"
          echo "📊 Deployment Summary:"
          echo "   - Version: ${{ inputs.version }}"
          echo "   - Environment: Production"
          echo "   - Status: Complete"
